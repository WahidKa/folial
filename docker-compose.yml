services:
  parser:
    build:
      context: .
      dockerfile: apps/parser/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:3000
      # Phase 2 placeholder: groq (default) or ollama (self-host fallback).
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_PARSER_URL: ${NEXT_PUBLIC_PARSER_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      # Container path (volume-backed). Local dev uses apps/web/.env instead.
      DATABASE_URL: ${DATABASE_URL:-file:/data/dev.db}
    volumes:
      - folial-data:/data
    depends_on:
      - parser

volumes:
  folial-data: